name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Run tests
        run: |
          make clean
          make check

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper devscripts

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect package artifacts
        run: |
          mkdir -p dist
          cp ../virtuallte_*.deb ../virtuallte_*.buildinfo ../virtuallte_*.changes dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtuallte-debian-package
          path: dist/*
          if-no-files-found: error

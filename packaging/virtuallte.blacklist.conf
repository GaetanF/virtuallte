# VirtualLTE USBIP mode:
# Prevent the local host from binding CDC/MBIM/ACM/USBNET drivers to the
# virtual gadget, so the device can be exported with usbip to a QEMU guest.
# Do not install on hosts that must use local USB modems.
install cdc_acm /bin/false
install cdc_mbim /bin/false
install cdc_wdm /bin/false
install cdc_ncm /bin/false
install cdc_ether /bin/false
install usbnet /bin/false